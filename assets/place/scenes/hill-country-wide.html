<!doctype html>
<!-- hill-country-wide: the Edwards Plateau, the Hill Country, as REGIONS.md describes it. Clear, dry, high-contrast light, with limestone throwing light up into shadows so they are brighter and cooler than anywhere else. White to pale grey limestone exposed constantly. Ashe juniper and live oak, grey-green and blue-green, never yellow-green. A creek over its limestone bed, a ranch gate. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1242px;height:2208px}</style>
</head>
<body>
<canvas id="plate" width="2484" height="4416"></canvas>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
import { bake } from '@@PLACE@@/plate.js';
const spec = {
  id: 'hill-country-wide', region: 'hill_country', seed: 81,
  world: { base: 'highNoon', overrides: { el: [34, 42], zenith: 0x4f88c8, horizon: 0xd2dde8, haze: 0xd8e1e8, ground: 0x8f9670,
    fogDensity: 0.00035, clouds: 0.28, envIntensity: 0.95, exposure: 0.95 } },
  sun: { az: 215, el: 38 },
  camera: { from: [0, 2.4, 34], look: [0, 18, -900], fov: 50 },
  shadow: { reach: 300, size: 140 },
  layers: [{ name: 'far', from: 450 }, { name: 'mid', from: 55 }, { name: 'near', from: 0 }],
};
window.renderReady = bake({ THREE, init, initKit, spec, build: (R, K, TXT, P) => {
  TXT.ground(R, { surface: 'grass', size: 9000, tile: 6, seed: 81, color: 0x8a9168 });
  const hills = K.make('hill_country_terrain', { size: 2400, relief: 80, trees: 1, season: 'summer', ground: 0x8a9168, seed: 4, budget: 380000 });
  hills.position.set(0, 0, -1200); TXT.add(R, hills);
  [[-22, -30, 'live_oak', 9, 14], [26, -46, 'ashe_juniper', 6, 6], [-40, -80, 'ashe_juniper', 6, 7], [40, -96, 'live_oak', 8, 12], [-70, -140, 'ashe_juniper', 6, 6]].forEach(([x, z, k, h, s], i) => {
    const t = K.make(k, { height: h, spread: s, seed: 120 + i }); t.position.set(x, 0, z); TXT.add(R, t); TXT.contact(R, t, { opacity: 0.4 });
  });
  const gate = K.make('ranch_gate', { seed: 2 }); gate.rotation.y = 0.2; gate.position.set(-16, 0, 8); TXT.add(R, gate);
  TXT.scatter(R, { kind: 'grass', count: 2600, area: [-60, -180, 60, 30], seed: 83, scale: [0.6, 1.0], colors: [0x9a9b6a, 0x8a8e60, 0xa8a876] });
}});
</script>
</body>
</html>
