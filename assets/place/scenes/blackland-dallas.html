<!doctype html>
<!-- blackland-dallas: Dallas from the Trinity River floodplain, Dallas County's own plate. The Blackland Prairie's milky afternoon light; the wide mown floodplain inside the levees, the river's channel and a few pecans and cottonwood-like shade trees; the downtown skyline with its ball-topped observation tower beyond the levee, two and a half kilometres off. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1242px;height:2208px}</style>
</head>
<body>
<canvas id="plate" width="2484" height="4416"></canvas>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
import { bake } from '@@PLACE@@/plate.js';
const spec = {
  id: 'blackland-dallas', region: 'blackland', seed: 61, counties: ['Dallas'],
  world: { base: 'highNoon', overrides: { el: [42, 50], zenith: 0x87a6c4, horizon: 0xe2e1d8, haze: 0xe5e2d4, ground: 0x3c3934,
    fogDensity: 0.00038, clouds: 0.34, sunDisc: 18, glow: 1.0, exposure: 0.96 } },
  sun: { az: 220, el: 44 },
  camera: { from: [0, 4.5, 60], look: [40, 70, -2400], fov: 40 },
  shadow: { reach: 320, size: 150 },
  layers: [{ name: 'far', from: 450 }, { name: 'mid', from: 70 }, { name: 'near', from: 0 }],
};
window.renderReady = bake({ THREE, init, initKit, spec, build: (R, K, TXT, P) => {
  TXT.ground(R, { surface: 'grass', size: 9000, tile: 6, seed: 61, color: 0x6f7a44 });
  const water = new THREE.MeshStandardMaterial({ color: 0x4a5040, roughness: 0.1, metalness: 0.0 });
  const river = new THREE.Mesh(new THREE.PlaneGeometry(4000, 34, 1, 1), water);
  river.rotation.x = -Math.PI / 2; river.position.set(0, 0.03, -520); R.scene.add(P.surface(river));
  for (let i = -10; i <= 10; i++) {           // the levee between the floodplain and the city
    const berm = K.make('earthen_berm', { length: 120, height: 9, crest: 6, slope: 3, turf: 'green', seed: 70 + i });
    berm.position.set(i * 120, 0, -1150); TXT.add(R, berm);
  }
  let seed = 500;
  [[-60, -380], [-20, -420], [90, -600], [130, -640], [-220, -700], [260, -470], [-140, -330]].forEach(([x, z], i) => {
    const t = K.make('pecan', { height: 15 + (i % 3) * 2, spread: 14, seed: seed++ }); t.position.set(x, 0, z); TXT.add(R, t);
  });
  TXT.scatter(R, { kind: 'grass', count: 6000, area: [-90, -300, 90, 60], seed: 62, scale: [0.6, 1.0],
                   colors: [0x8f9258, 0x7c8450, 0xa0a066] });
  const city = K.make('city_skyline', { city: 'dallas', lowrise: true }); city.position.set(80, 0, -2700); TXT.add(R, city);
}});
</script>
</body>
</html>
