<!doctype html>
<!-- south-texas-wide: the South Texas Plains, the Brush Country, as REGIONS.md describes them. Hard, bright, dusty light and constant heat shimmer. Caliche, sand, thorn litter. Thorn scrub dense enough to be impassable: mesquite, huisache, blackbrush, prickly pear with magenta tunas on the pad rims. A tank battery in the Eagle Ford. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1242px;height:2208px}</style>
</head>
<body>
<canvas id="plate" width="2484" height="4416"></canvas>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
import { bake } from '@@PLACE@@/plate.js';
const spec = {
  id: 'south-texas-wide', region: 'south_texas', seed: 71,
  world: { base: 'highNoon', overrides: { el: [56, 64], zenith: 0x6b93c0, horizon: 0xe1dacb, haze: 0xe5d8be, ground: 0xb9a27a,
    fogDensity: 0.0008, clouds: 0.16, sunDisc: 24, exposure: 0.95 } },
  sun: { az: 200, el: 60 },
  camera: { from: [1, 2.0, 38], look: [10, 5, -600], fov: 50 },
  shadow: { reach: 280, size: 110 },
  layers: [{ name: 'far', from: 380 }, { name: 'mid', from: 45 }, { name: 'near', from: 0 }],
};
window.renderReady = bake({ THREE, init, initKit, spec, build: (R, K, TXT, P) => {
  TXT.ground(R, { surface: 'caliche', size: 10000, tile: 6, seed: 71, color: 0xc3ad85 });
  for (let i = 0; i < 14; i++) { const rd = K.make('caliche_road', { length: 60, width: 4.6, curve: 0.22, seed: i, ground: 0xb7a07a }); rd.position.set(Math.sin(i * 0.5) * 6, 0, 30 - i * 58); TXT.add(R, rd); }
  let seed = 300;
  for (let i = 0; i < 70; i++) {            // the thorn scrub, mesquite and huisache, close together
    const x = ((i * 47) % 260) - 130, z = -20 - ((i * 29) % 420);
    if (Math.abs(x - Math.sin(-z / 58 * 0.5) * 6) < 6) continue;
    const m = K.make('mesquite', { height: 3 + (i % 3), spread: 4 + (i % 4), seed: seed++ }); m.position.set(x, 0, z); TXT.add(R, m);
  }
  for (let i = 0; i < 40; i++) {            // prickly pear with tunas standing on the rims
    const x = ((i * 31) % 90) - 45, z = 20 - ((i * 17) % 160);
    if (Math.abs(x) < 5) continue;
    const pp = P.shapes.pricklyPear({ seed: seed++, pads: 10 + (i % 8) }); pp.scale.setScalar(1.4 + (i % 3) * 0.3); pp.position.set(x, 0, z); TXT.add(R, pp);
  }
  for (let i = 0; i < 30; i++) { const b = P.shapes.creosote({ seed: seed++, h: 1.2, w: 1.6 }); b.position.set(((i * 53) % 140) - 70, 0, -10 - ((i * 41) % 200)); TXT.add(R, b); }
  const tanks = K.make('oil_tank', { tanks: 6 }); tanks.rotation.y = 0.4; tanks.position.set(120, 0, -380); TXT.add(R, tanks); TXT.contact(R, tanks);
  TXT.scatter(R, { kind: 'grass', count: 2000, area: [-60, -120, 60, 30], avoid: [[-4, -700, 4, 40]], seed: 72, scale: [0.5, 0.9], colors: [0xb3a272, 0x9f9462] });
}});
</script>
</body>
</html>
