name: guards

# The gates, run on every change. Each self-tests FIRST: a gate that cannot go red proves
# nothing about what it guards, so the self-test reintroduces known-bad inputs and requires
# the checker to reject them before the real run is allowed to mean anything.

# WHY NOT ON EVERY PUSH. `branches-ignore: [main]` fired this on every intermediate dev
# commit and every unattended routine step, so each failing work-in-progress commit mailed
# the maintainer a red, until the noise was the whole signal. Worse, it ran on everything
# EXCEPT main, so the branch that ships was the one branch never validated, and a PR merged
# with the repo's own GITHUB_TOKEN does not start a workflow either. The merge is where a
# change becomes real. Now it runs on PRs and on main itself, matching the sibling repos.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          # numpy is not optional here. The voice gates decode raw PCM, measure BS.1770
          # loudness and track pitch with it, and a run that pip-installs less than the gates
          # need does not skip them, it FAILS them. This repo has already lost a first push to
          # exactly that, and the wrong fix is to make a gate skip when its dependency is
          # missing: a skipped test and a passing test are the same colour.
          pip install --quiet pyyaml numpy requests

      - name: Engine lint self-test (the defects tsc is structurally blind to)
        run: |
          # Two corrupted colour literals shipped into this repo in one session, both valid
          # TypeScript. A browser drops an unparseable colour silently and paints the default,
          # so the frame renders and the region is quietly the wrong colour.
          python3 scripts/engine_lint.py --self-test
          python3 scripts/engine_lint.py

      - name: The bar is stated exactly once
        run: |
          # The sibling lost five panel rounds in one run to a threshold written down twice:
          # its prompt said 9.0 while the rubric said 7.5, so the panel was briefed the wrong
          # number and returned ship:false on a cut already over the real bar.
          python3 scripts/bar_check.py --self-test
          python3 scripts/bar_check.py

      - name: An animal belongs where it is standing
        run: |
          # knowledge/texas/FAUNA_AND_FLORA.md promises every animal is placed in a region that
          # actually has it, and named this checker as what enforces it. Until it existed the
          # HABITAT map in fauna.tsx was read by nothing. Its coverage rule found BatColumn with
          # no habitat entry, and its first real run found two species whose habitat lists were
          # simply wrong.
          # --board IS THE HALF THAT REACHES A FILM. The source rule matches a literal
          # region="..." in TSX, and Dispatch.tsx renders region={scene.region}, a variable,
          # so the deliverable was structurally invisible to it: instrumented, it evaluated
          # five animal placements, all five inside ProofScene.tsx, which no run renders.
          # Zero in a Dispatch, ever. A pronghorn in the Piney Woods and a javelina in the
          # Rolling Plains both cleared Gate 0 on the real board.
          #
          # Its first run against examples/board.json found four real placements wrong.
          python3 scripts/staging_check.py --self-test
          python3 scripts/staging_check.py
          python3 scripts/staging_check.py --board examples/board.json

      - name: VO soundcheck self-test (best of N, and the take that reads a tag aloud)
        run: |
          # Gemini renders the whole passage in one call, so a bad take is bad for sixty
          # seconds rather than for one line. The check that matters most is the spoken tag:
          # direction written inline CAN be read aloud, and a narrator who says the word
          # "excited" has ended the film. Duration failures say TRIM THE SCRIPT, never stretch.
          python3 scripts/vo_soundcheck.py --self-test

      - name: The id the routine renders is an id the engine registers
        run: |
          # Phase 5 has always run `npx remotion render Dispatch` and Root.tsx registered no such
          # composition, so EVERY unattended run produced no film. tsc is clean because an id is a
          # string; engine_lint reads colours; wiring_check knows agents and scripts and has no
          # notion of a composition. The deliverable itself was the orphan.
          python3 scripts/composition_check.py --self-test
          python3 scripts/composition_check.py

      - name: Everything that exists is reachable, and everything named exists
        run: |
          # The failure this whole project was set up to prevent: move a thing over and forget to
          # wire it up. It happened here. .claude/agents/scorer.md sat fully written on disk while
          # Phase 6 said only "then the panel" and never named it, so no run would have spawned it,
          # and every other gate was green. A --self-test mention is NOT wiring: counting CI runs as
          # invocation makes the orphan check structurally incapable of failing for any gate.
          python3 scripts/wiring_check.py --self-test
          python3 scripts/wiring_check.py

      - name: The variety engine, so no two Dispatches are the same film
        run: |
          # The sibling shipped "a salmon video that looked just like the damn beluga video". Its
          # free-text archetype label read the same for both, because A NEW SUBJECT IS NOT A NEW
          # COMPOSITION. dedupe carries the topic and the composition fingerprint; storyboard_check
          # refuses a re-skin before a frame is rendered. The dedupe stopword list is the hard part:
          # a gate that calls every run a repeat teaches a run to argue past it.
          python3 scripts/dedupe.py --self-test

      - name: A drawing nothing can stage is dead weight
        run: |
          # registry.tsx opened by claiming this checker already walked the library and failed
          # on any unregistered export. It did not exist: the guarantee lived in a comment, in
          # the repo whose founding fault is moving a thing over and forgetting to wire it up.
          # wiring_check cannot see it either, because a script named only in a TSX comment is
          # invisible to both of its directions.
          python3 scripts/registry_check.py --self-test
          python3 scripts/registry_check.py

      - name: The storyboard, before a single frame is rendered
        run: |
          # Gate 0. Everything after this point costs a render, so a board that is wrong here
          # costs a paragraph instead of an hour. The check that earns its keep is DIVERGENCE
          # measured on the composition signature rather than the label: six scenes that all say
          # dollyThrough over the same planes read as a varied board and play as one shot.
          python3 scripts/storyboard_check.py --self-test

      - name: The cut flows, and the ear moves with the eye
        run: |
          # A film can pass every per-scene check and still be good frames with nothing pulling
          # the viewer across the joins. This measures rests ACROSS boundaries, a motivated sound
          # on every beat, and whether the picture ever shows what the voice is talking about.
          python3 scripts/flow_check.py --self-test

      - name: The voice is synthesised, measured and aligned honestly
        run: |
          # vo_synth builds the prompt so direction is a PREAMBLE and the script is fenced, and
          # refuses a script containing direction BEFORE spending a call. Its self-test also pins
          # its drone measurement to the threshold vo_soundcheck refuses on, because two files
          # that agree by convention rather than by test drift apart unwatched.
          python3 scripts/vo_synth_gemini.py --self-test
          # Caption boundaries land on measured silence, so error re-anchors every phrase instead
          # of accumulating across the film.
          python3 scripts/vo_align.py --self-test
          # And the mixer has no resampler in it. Not disabled, absent, and the self-test proves
          # the absence by scanning its own code with the prose stripped out.
          python3 scripts/mix.py --self-test
          # The foley library is hand-synthesised, so every sound is checked to synthesise to a
          # clean 48k buffer, to be deterministic, and its validator is fed known-bad buffers and
          # required to reject each, so a green run is not a checker that stopped checking.
          # THE VALIDATOR'S FIRST FOUR CHECKS CANNOT FIRE ON A REAL SOUND. Every sound
          # function ends in normalize(x, peak), so the clip, silence, dtype and length
          # tests are structurally unreachable and only the NaN test could ever go red.
          # Proved by breaking the product: replacing _fft_filter with the identity, which
          # turns all 31 sounds into raw white noise, left this printing "all passed" and
          # exiting 0. So did an impulse plus six seconds of silence, and a 0.5 Hz sine.
          # The spectral check is what holds the library, because filtering is what can
          # actually break here and filtering is invisible to amplitude after a normalize.
          python3 scripts/foley.py --self-test
          # AND THE BUILD PATH, which is what the routine runs and what writes the shipped
          # wavs. It used to return a literal 0 after writing 31 files, checking nothing,
          # while write_wav silently hard-clipped anything out of range on the way to disk.
          python3 scripts/foley.py --build "$(mktemp -d)"
          # The music bed is licensed by its CREDIT, so the credit is machine-generated
          # and checked. The self-test proves each refusal fires (NonCommercial,
          # NoDerivatives, ShareAlike, all-rights-reserved, an unknown licence, a BY
          # label pointing at an NC deed) and that a film missing the attribution is
          # refused, because a credit that does not ship is a licence not paid.
          python3 scripts/music.py --self-test
          python3 scripts/music.py --check
          # AND THE SOURCES HAVE TO RESOLVE. --check verifies the field is a non-empty
          # string and never that it leads anywhere: three of eleven entries pointed at
          # Commons files that 404, and all eleven were reported usable. For a CC BY
          # track that page IS the licence, so a run picking one would have generated a
          # credit naming a page that does not exist and --verify-film would have passed
          # it. A 404 is a hard fail here; an unreachable host is not, because a licence
          # gate that goes red on a runner with no network is a gate everyone ignores.
          python3 scripts/music.py --check-links

      - name: The rubric's hard fails, checked rather than promised
        run: |
          # Six of the seven hard fails are mechanical, so they are mechanical. The numeral
          # tokeniser is the part that has been wrong before: a sibling read "2,600 streamlines"
          # as the number 600 and reported a correct figure as unauthorised, which is how a gate
          # gets switched off. The bar is READ from the rubric and never restated here.
          python3 scripts/ship_gate.py --self-test

      - name: The shipping gate reads fields that exist, on the board that really ships
        run: |
          # THE SELF-TEST ABOVE WAS GREEN WHILE THREE SECTIONS OF THAT GATE READ NOTHING.
          # Between them they named six scene fields no board has ever had (supers,
          # slide_text, lower_third, vo, note, location) and missed `super`, the one
          # authored string Dispatch.tsx paints on screen. The fixture carried the phantom
          # fields and the real board did not, so the gate checked a film that does not
          # exist. A fabricated numeral and a retired motif both cleared it, in the field
          # a viewer reads.
          #
          # This binds the gate's field names against examples/board.json, the 8-scene
          # board this repo commits and that nothing in CI used to open at all.
          python3 - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("sg", "scripts/ship_gate.py")
          sg = importlib.util.module_from_spec(spec); spec.loader.exec_module(sg)
          board = json.loads(Path("examples/board.json").read_text(encoding="utf-8"))
          bad = sg.schema_bound(board, sg.SCENE_PROSE)
          if bad:
              sys.exit("\n".join(bad))
          if "super" not in sg.scene_schema():
              sys.exit("the renderer no longer declares `super`, and the copy gate reads it")
          roster = sg.cast_roster()          # raises rather than returning a short table
          print(f"bound: {len(sg.SCENE_PROSE)} prose field(s), {len(roster)} cast members, "
                f"{len(board['scenes'])} scenes")
          PY

      - name: If the number moved, would the test notice
        run: |
          # Every gate has a --self-test, CI runs all of them, and they are all green. None of
          # that is evidence: a green self-test means either the checker works or the checker is
          # disconnected from what it checks, and those two look identical. The deep review found
          # three assertions that could not fail whatever the code did, including one comparing a
          # function to the constant it returns. This is the general form of the question. It
          # makes each declared threshold vacuous, one at a time, and requires that gate's own
          # self-test to go red. A threshold that survives is a threshold nothing is holding.
          python3 scripts/mutation_check.py --self-test
          python3 scripts/mutation_check.py

      - name: Engine typechecks
        run: |
          cd video-engine
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Two of a thing are two things
        run: |
          # An SVG gradient is referenced by DOCUMENT-GLOBAL id and the browser silently takes
          # the first match. Every drawn thing built its ids out of `seed`, which carries a
          # per-species default, so two longhorns staged without distinct seeds both emitted
          # id="lh5_c" and the second animal was painted with the first animal's coat. tsc is
          # clean because an id is a string, engine_lint reads colours, and the fauna sheet's
          # herd row passes explicit seeds so the one surface that would have shown it could
          # not. This renders the library to markup and reads the markup.
          cd video-engine
          node tests/paint_ids.mjs --self-test
          node tests/paint_ids.mjs

      - name: Every metre table is checked, not just fauna's
        run: |
          # Seventeen modules export a *_M table of real dimensions and ONE of them was read
          # by any gate. staging_check enforces the rule beautifully and only on fauna.tsx,
          # because that is the module it was written for. Behind the other sixteen: a
          # marching band 13 cm tall, a 0.92 m tortilla on a griddle sized from an ice cream
          # cart's entry, and a raspa cup that scaled quadratically.
          python3 scripts/scale_check.py --self-test
          python3 scripts/scale_check.py

      - name: The person next to a thing is the same size as it
        run: |
          # The review sheets exist so somebody can look at a component beside a human being
          # and see whether it is right. Eleven of the fourteen rows carrying a human
          # reference staged that person at a DIFFERENT scale from the thing measured, up to
          # 3.2 times life size. The rig row is the one that cost something: an engineer at
          # 0.28 against a truck at 0.16 made a cab roof drawn 12 percent too tall look
          # fine, and it was signed off on that row twice.
          #
          # A ruler nobody checked is worse than no ruler, because a reviewer trusts it.
          python3 scripts/sheet_ruler_check.py --self-test
          python3 scripts/sheet_ruler_check.py

      - name: The hat rules are called by something
        run: |
          # headgearConflict() and seasonalHat() are two carefully written functions in
          # Character.tsx with ZERO CALL SITES anywhere in the repo. The routine prompt says
          # headgearConflict "refuses that pairing" and ship_gate's comment said it "guards
          # the engine". Both sentences described a function nothing calls, which is worse
          # than a missing check because three documents asserted the protection existed.
          #
          # The board half is fixed in ship_gate, which now resolves the hat off the actual
          # placement. This is the engine half: the roster is data, one keystroke puts a felt
          # hat on FR coveralls, and the rule written to catch that now runs on every entry.
          cd video-engine
          node tests/cast_safety.mjs --self-test
          node tests/cast_safety.mjs

      - name: The drawing is the right size, measured not read
        run: |
          # scale_check reads TSX and cannot see whether what came out is the right SIZE,
          # because that depends on path coordinates it does not evaluate. This renders each
          # component and reads the emitted scale back off the markup. Its self-test replays
          # the band's pre-fix code and requires the measurement to come out at 13 cm, so the
          # gate is provably able to go red rather than only ever seeing corrected code.
          cd video-engine
          node tests/true_scale.mjs --self-test
          node tests/true_scale.mjs
